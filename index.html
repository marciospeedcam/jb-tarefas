<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JB Tarefas</title>
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="JB Tarefas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{--bg:#0e0e0e;--card:#1a1a1a;--card2:#232323;--gold:#d4af37;--gold2:#f0d77a;--txt:#f2f2f2;--mut:#a0a0a0;--red:#ff6b5e;--ok:#5fd38d;--line:#2e2e2e}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
  .top{display:flex;align-items:center;gap:10px}
  .top img{width:40px;height:40px;border-radius:9px}
  .top h1{font-size:18px;margin:0;color:var(--gold);flex:1;line-height:1.15}
  .top h1 small{display:block;color:var(--mut);font-size:13px;font-weight:400}
  .icobtn{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer}
  nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
  .tab.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
  .tab .n{display:inline-block;margin-left:6px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;font-weight:700}
  .tab.on .n{background:#111;color:var(--gold)}
  main{padding:12px 16px;max-width:720px;margin:0 auto}
  .card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .card.atrasada{border-color:#5a2a26}
  .card.feita{opacity:.75}
  .check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:20px;cursor:pointer}
  .check.done{background:var(--ok);border-color:var(--ok);color:#111;cursor:default}
  .check.wait{border-color:var(--line);color:var(--mut);cursor:default;font-size:18px}
  .corpo{flex:1;min-width:0}
  .txt{font-size:16px;white-space:pre-wrap;word-wrap:break-word}
  .card.feita .txt{text-decoration:line-through;color:var(--mut)}
  .meta{color:var(--mut);font-size:13px;margin-top:6px}
  .meta b{color:var(--txt);font-weight:600}
  .tag{display:inline-block;margin-top:8px;font-size:12px;border-radius:8px;padding:3px 8px;background:var(--card2);color:var(--mut)}
  .tag.late{background:#3a1d1a;color:var(--red)}
  .tag.ok{background:#173323;color:var(--ok)}
  .obs{margin-top:6px;font-size:13px;color:var(--gold2)}
  .del{background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer;padding:0;margin-top:8px;margin-left:8px}
  .pessoas{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:6px 0 14px}
  .pessoas label{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:16px;color:var(--txt);border-bottom:1px solid var(--line)}
  .pessoas label:last-child{border-bottom:none}
  .pessoas input{width:22px;height:22px;margin:0;accent-color:var(--gold);flex:none}
  .andam{margin-top:8px;font-size:14px;background:#1d2633;border-left:3px solid #6aa7ff;border-radius:8px;padding:8px 10px;color:#cfe2ff;white-space:pre-wrap;word-wrap:break-word}
  .andam small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
  .tag.and{background:#1d2633;color:#8fbcff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
  .vazio{text-align:center;color:var(--mut);padding:50px 10px}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--gold);color:#111;border:none;border-radius:999px;padding:16px 28px;font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;z-index:6}
  .alerta{background:#2b1a0e;border:1px solid #6b4a14;color:#ffd590;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
  .alerta ul{margin:6px 0 8px;padding-left:18px}
  .aviso{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--mut)}
  .aviso b{color:var(--gold)}
  .btn{display:block;width:100%;background:var(--gold);color:#111;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500}
  .btn.peq{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
  .btn:disabled{opacity:.5}
  input,textarea,select{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;margin:6px 0 14px}
  textarea{min-height:110px;resize:vertical}
  label{font-size:14px;color:var(--mut)}
  .tela{max-width:420px;margin:40px auto;padding:0 20px;text-align:center}
  .tela img{width:120px;height:120px;border-radius:24px;margin-bottom:16px}
  .tela h2{color:var(--gold);margin:0 0 6px}
  .tela p{color:var(--mut);margin:0 0 18px}
  .tela input{text-align:center;font-size:18px}
  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .modal h3{margin:0 0 12px;color:var(--gold)}
  .linha{display:flex;gap:10px;margin-top:4px}
  .linha .btn{flex:1}
  .status{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#3a1d1a;color:#ffb3aa;border-radius:10px;padding:8px 14px;font-size:14px;z-index:30;max-width:92vw;text-align:center}
  .passos{text-align:left;color:var(--txt);font-size:15px;background:var(--card2);border-radius:12px;padding:12px 14px 12px 34px;margin:0 0 14px}
  .passos li{margin:4px 0}
  @media (min-width:700px){.fundo{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>
<div id="status" class="status hidden"></div>

<!-- Carregando -->
<div id="telaCarregando" class="tela">
  <img src="icon-512.png" alt="">
  <p>Carregando…</p>
</div>

<!-- Nome do grupo (só na primeira vez de todas) -->
<div id="telaGrupo" class="tela hidden">
  <img src="icon-512.png" alt="">
  <h2>Bem-vindo!</h2>
  <p>Qual é o nome do grupo ou da empresa?</p>
  <input id="inGrupo" maxlength="60" placeholder="Ex.: Grupo JB" autocomplete="off">
  <button class="btn" id="btGrupo">Continuar</button>
</div>

<!-- Nome da pessoa (uma vez em cada celular) -->
<div id="telaNome" class="tela hidden">
  <img src="icon-512.png" alt="">
  <h2 id="nomeGrupoTela">Tarefas</h2>
  <p>Digite o seu nome. É assim que as outras pessoas vão te ver.</p>
  <input id="inNome" maxlength="40" placeholder="Seu nome" autocomplete="off">
  <button class="btn" id="btNome">Entrar</button>
</div>

<!-- App -->
<div id="telaApp" class="hidden">
  <header>
    <div class="top">
      <img src="icon-192.png" alt="">
      <h1><span id="hGrupo">Tarefas</span><small id="hMe"></small></h1>
      <button class="icobtn" id="btShareApp" aria-label="Compartilhar app">📤</button>
      <button class="icobtn" id="btMenu" aria-label="Opções">⚙︎</button>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main>
    <div id="instalar" class="aviso hidden"></div>
    <div id="ativarAvisos" class="aviso hidden">
      <b>Avisos de tarefa</b><br>Ative para receber aviso quando chegar tarefa para você e lembrete a cada 24h.
      <div style="margin-top:8px"><button class="btn peq" id="btAvisos">Ativar avisos</button></div>
    </div>
    <div id="alerta" class="alerta hidden"></div>
    <div id="lista"></div>
  </main>
  <button class="fab" id="btNova">+ Nova tarefa</button>
</div>

<div id="modal" class="fundo hidden"><div class="modal" id="modalBox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';
const firebaseConfig = {
  apiKey: "AIzaSyCFJ2ZbGgsY1tfsNdUFQOgLc-rk6drAGOs",
  authDomain: "jb-tarefas.firebaseapp.com",
  projectId: "jb-tarefas",
  storageBucket: "jb-tarefas.firebasestorage.app",
  messagingSenderId: "1071783646429",
  appId: "1:1071783646429:web:27e6d0eab0230c5ed33734"
};
const DIA = 24*60*60*1000;
const $ = id => document.getElementById(id);
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function fmt(ms){ if(!ms) return '—'; const d=new Date(ms); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function tempo(ms){ const h=Math.floor(ms/3600000); if(h<1) return 'menos de 1h'; if(h<48) return h+'h'; return Math.floor(h/24)+' dias'; }
function setStatus(msg, erro){ const s=$('status'); if(!msg){ s.classList.add('hidden'); return; } s.textContent=msg; s.classList.remove('hidden'); if(!erro) setTimeout(()=>s.classList.add('hidden'),2500); }
function mostrar(id){ ['telaCarregando','telaGrupo','telaNome','telaApp'].forEach(t=>$(t).classList.toggle('hidden', t!==id)); }

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let me=null, grupo=null, membros=[], tarefas=[], aba='paramim', modalKind=null;
let loadedG=false, loadedM=false, loadedT=false, primeiraCarga=true;
const vistos = new Set(); const papeis = {};

function nomeDe(id){ const m=membros.find(x=>x.id===id); return m?m.nome:''; }
function meuNome(){ return nomeDe(me); }
function ver(t){ return Array.isArray(t.verIds)? t.verIds : []; }
function acompanho(t){ return ver(t).includes(me) && t.paraId!==me && t.deId!==me; }
function nomesLista(ids){ const l=ids.map(i=>i===me?'você':nomeDe(i)).filter(Boolean); if(l.length<2) return l.join(''); return l.slice(0,-1).join(', ')+' e '+l[l.length-1]; }
// O banco só aceita mudar tarefa para "feita"; para editar/andamento, quem criou recria a tarefa com os dados novos
function salvarTarefa(t, upd){
  const ref=db.doc('tarefas/'+t.id);
  return ref.update(upd).catch(e=>{
    if(t.deId!==me) throw e;
    const novo={}; Object.keys(t).forEach(k=>{ if(k!=='id' && t[k]!==undefined) novo[k]=t[k]; }); Object.assign(novo, upd);
    return db.collection('tarefas').add(novo).then(()=>ref.delete());
  });
}
function campoPessoas(box, marcados){
  box.append(el('label',null,'Quem pode acompanhar? (só vê, não marca como feita)'));
  const div=el('div','pessoas');
  [...membros].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).forEach(m=>{
    const lb=el('label'); const cb=el('input'); cb.type='checkbox'; cb.value=m.id; cb.checked=marcados.includes(m.id);
    lb.append(cb, document.createTextNode(m.id===me? m.nome+' (eu)': m.nome)); div.append(lb);
  });
  box.append(div);
  return ()=>[...div.querySelectorAll('input:checked')].map(i=>i.value);
}
function campoQuem(box, atual){
  box.append(el('label',null,'Quem vai fazer?'));
  const sel=el('select');
  sel.append(new Option('Escolha a pessoa',''));
  [...membros].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).forEach(m=>sel.append(new Option(m.id===me? m.nome+' (eu)': m.nome, m.id)));
  sel.value=atual||''; box.append(sel); return sel;
}

// ---------- Service worker / instalação / avisos ----------
let swReg=null;
// Versão nova do app: busca sem cache e recarrega sozinho quando chegar atualização
if('serviceWorker' in navigator){
  const tinhaControle=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ swReg=r; r.update().catch(()=>{}); }).catch(()=>{});
  let recarregou=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(tinhaControle && !recarregou && !modalKind){ recarregou=true; location.reload(); } });
}
// Ao voltar para o app depois de um tempo, recarrega tudo (dados e versão); se estiver escrevendo algo, só reconecta
let escondidoEm=0;
function voltou(){
  if(document.hidden) return;
  if(swReg) swReg.update().catch(()=>{});
  const longe = escondidoEm && Date.now()-escondidoEm>15000; escondidoEm=0;
  if(longe && !modalKind){ location.reload(); return; }
  try{ db.disableNetwork().then(()=>db.enableNetwork()).catch(()=>{}); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) escondidoEm=Date.now(); else voltou(); });
window.addEventListener('pageshow',ev=>{ if(ev.persisted) location.reload(); });
window.addEventListener('focus',voltou);
window.addEventListener('online',()=>{ try{ db.enableNetwork().catch(()=>{}); }catch(e){} });
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let promptInstalar=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalar=e; renderInstalar(); });

function renderInstalar(){
  const box=$('instalar');
  if(standalone || lsGet('jbt_inst_ok')){ box.classList.add('hidden'); return; }
  box.replaceChildren();
  box.append(el('b',null,'Instale o app no celular'), el('br'));
  if(promptInstalar){
    box.append(document.createTextNode('Toque no botão para colocar o JB Tarefas na tela inicial.'));
    const b=el('button','btn peq','Instalar app'); b.style.marginTop='8px';
    b.onclick=async()=>{ promptInstalar.prompt(); try{ await promptInstalar.userChoice; }catch(e){} promptInstalar=null; renderInstalar(); };
    const d=el('div'); d.append(b); box.append(d);
  } else if(ios){
    box.append(document.createTextNode('No Safari: toque em Compartilhar (quadrado com seta ↑) e depois em "Adicionar à Tela de Início".'));
  } else {
    box.append(document.createTextNode('No Chrome: toque nos 3 pontinhos ⋮ e depois em "Instalar app" ou "Adicionar à tela inicial".'));
  }
  const x=el('button','del','Já instalei'); x.onclick=()=>{ lsSet('jbt_inst_ok','1'); renderInstalar(); };
  box.append(el('br'), x);
  box.classList.remove('hidden');
}

function podeAvisar(){ return ('Notification' in window) && Notification.permission==='granted'; }
function renderAtivarAvisos(){
  const show = ('Notification' in window) && Notification.permission==='default' && (standalone || !ios);
  $('ativarAvisos').classList.toggle('hidden', !show);
}
$('btAvisos').onclick=async()=>{ try{ await Notification.requestPermission(); }catch(e){} renderAtivarAvisos(); if(podeAvisar()) notificar('Avisos ativados','Você vai ser avisado das suas tarefas.'); };

async function notificar(titulo, corpo, tag){
  if(!podeAvisar()) return;
  const op={body:corpo, icon:'icon-192.png', badge:'icon-192.png', tag:tag||undefined};
  try{
    const r = swReg || (navigator.serviceWorker && await navigator.serviceWorker.ready);
    if(r && r.showNotification){ await r.showNotification(titulo, op); return; }
  }catch(e){}
  try{ new Notification(titulo, op); }catch(e){}
}

// ---------- Telas iniciais ----------
$('btGrupo').onclick=async()=>{
  const n=$('inGrupo').value.trim(); if(!n){ $('inGrupo').focus(); return; }
  $('btGrupo').disabled=true;
  try{ await db.doc('config/grupo').set({nome:n, criadoEm:Date.now(), criadoPor:me}); }
  catch(e){ setStatus('Não deu para salvar. Confira a internet.', true); }
  $('btGrupo').disabled=false;
};
$('inGrupo').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btGrupo').click(); });

$('btNome').onclick=async()=>{
  const n=$('inNome').value.trim(); if(!n){ $('inNome').focus(); return; }
  $('btNome').disabled=true;
  try{ await db.doc('membros/'+me).set({nome:n, desde:Date.now()}); lsSet('jbt_nome',n); }
  catch(e){ setStatus('Não deu para salvar. Confira a internet.', true); }
  $('btNome').disabled=false;
};
$('inNome').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btNome').click(); });

// ---------- Modais ----------
function abrirModal(kind, montar){ modalKind=kind; const box=$('modalBox'); box.replaceChildren(); montar(box); $('modal').classList.remove('hidden'); }
function fecharModal(){ modalKind=null; $('modal').classList.add('hidden'); render(); }
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')) fecharModal(); });

$('btNova').onclick=()=>abrirModal('nova', box=>{
  box.append(el('h3',null,'Nova tarefa'));
  box.append(el('label',null,'O que precisa ser feito?'));
  const ta=el('textarea'); ta.maxLength=1000; ta.placeholder='Descreva a tarefa'; box.append(ta);
  const sel=campoQuem(box, me);
  const pegarVer=campoPessoas(box, []);
  if(membros.length<2){ const p=el('p','meta','Só aparecem aqui as pessoas que já abriram o app e digitaram o nome. Mande o link para elas!'); p.style.marginTop='-6px'; box.append(p); }
  const linha=el('div','linha');
  const c=el('button','btn sec','Cancelar'); c.onclick=fecharModal;
  const ok=el('button','btn','Enviar tarefa');
  ok.onclick=async()=>{
    const texto=ta.value.trim(), para=sel.value;
    if(!texto){ ta.focus(); return; } if(!para){ sel.focus(); return; }
    ok.disabled=true;
    try{
      const verIds=pegarVer().filter(i=>i!==para);
      await db.collection('tarefas').add({texto, deId:me, deNome:meuNome(), paraId:para, paraNome:nomeDe(para), verIds, criadoEm:Date.now(), status:'pendente'});
      aba = para===me ? 'paramim' : 'enviadas';
      fecharModal(); setStatus('Tarefa enviada ✓');
    }catch(e){ ok.disabled=false; setStatus('Não deu para enviar. Confira a internet.', true); }
  };
  linha.append(c,ok); box.append(linha);
  setTimeout(()=>ta.focus(),50);
});

function modalResolver(t){
  abrirModal('resolver', box=>{
    box.append(el('h3',null,'Marcar como resolvida?'));
    const p=el('p','txt',t.texto); p.style.margin='0 0 12px'; box.append(p);
    box.append(el('label',null,'Observação (opcional)'));
    const ob=el('input'); ob.maxLength=300; ob.placeholder='Ex.: feito, troquei a peça'; box.append(ob);
    const linha=el('div','linha');
    const c=el('button','btn sec','Voltar'); c.onclick=fecharModal;
    const ok=el('button','btn','✓ Resolvida');
    ok.onclick=async()=>{
      ok.disabled=true;
      const upd={status:'feita', feitaEm:Date.now(), feitaPorNome:meuNome(), feitaPorId:me};
      if(ob.value.trim()) upd.obs=ob.value.trim();
      const base={status:'feita', feitaEm:upd.feitaEm, feitaPorNome:upd.feitaPorNome}; if(upd.obs) base.obs=upd.obs;
      Object.assign(t, base); fecharModal(); setStatus('Tarefa resolvida ✓');
      const ref=db.doc('tarefas/'+t.id);
      ref.update(upd).catch(e=>{ console.log('[JBT] resolver', e&&e.code); return ref.update(base); })
        .catch(e=>setStatus('Não deu para concluir ('+((e&&e.code)||'erro')+')', true));
    };
    linha.append(c,ok); box.append(linha);
  });
}

function modalApagar(t){
  abrirModal('apagar', box=>{
    box.append(el('h3',null,'Apagar esta tarefa?'));
    const p=el('p','txt',t.texto); p.style.margin='0 0 16px'; box.append(p);
    const linha=el('div','linha');
    const c=el('button','btn sec','Voltar'); c.onclick=fecharModal;
    const ok=el('button','btn','Apagar'); ok.style.background='var(--red)';
    ok.onclick=()=>{
      tarefas=tarefas.filter(x=>x.id!==t.id); fecharModal(); setStatus('Tarefa apagada');
      db.doc('tarefas/'+t.id).delete().catch(e=>
        db.doc('tarefas/'+t.id).update({status:'apagada', apagadaEm:Date.now()})
          .catch(e2=>setStatus('Não deu para apagar ('+((e2&&e2.code)||(e&&e.code)||'erro')+')', true)));
    };
    linha.append(c,ok); box.append(linha);
  });
}

function modalAndamento(t){
  abrirModal('andamento', box=>{
    box.append(el('h3',null,'Atualizar andamento'));
    const p=el('p','txt',t.texto); p.style.margin='0 0 12px'; box.append(p);
    box.append(el('label',null,'O que está acontecendo?'));
    const chips=el('div','chips');
    const ta=el('textarea'); ta.maxLength=500; ta.placeholder='Ex.: liguei, aguardando retorno do fornecedor'; ta.value=t.andamento||''; ta.style.minHeight='90px';
    ['Em andamento','Aguardando resposta','Aguardando fornecedor','Aguardando pagamento'].forEach(x=>{ const c=el('button','chip',x); c.onclick=()=>{ ta.value=x+(ta.value&&!ta.value.startsWith('Aguardando')&&ta.value!=='Em andamento'?' — '+ta.value:''); ta.focus(); }; chips.append(c); });
    box.append(chips, ta);
    const linha=el('div','linha');
    const c=el('button','btn sec','Cancelar'); c.onclick=fecharModal;
    const ok=el('button','btn','Salvar');
    ok.onclick=()=>{
      const v=ta.value.trim();
      const upd={andamento:v, andamentoEm:Date.now(), andamentoPor:meuNome(), andamentoPorId:me};
      Object.assign(t, upd); fecharModal(); setStatus('Andamento salvo ✓');
      salvarTarefa(Object.assign({},t), upd).catch(e=>setStatus('Não deu para salvar ('+((e&&e.code)||'erro')+')', true));
    };
    linha.append(c,ok); box.append(linha);
    setTimeout(()=>ta.focus(),50);
  });
}

function modalEditar(t){
  abrirModal('editar', box=>{
    box.append(el('h3',null,'Editar tarefa'));
    box.append(el('label',null,'Texto'));
    const ta=el('textarea'); ta.maxLength=1000; ta.value=t.texto; box.append(ta);
    const sel=campoQuem(box, t.paraId);
    const pegarVer=campoPessoas(box, ver(t));
    const linha=el('div','linha');
    const c=el('button','btn sec','Cancelar'); c.onclick=fecharModal;
    const ok=el('button','btn','Salvar');
    ok.onclick=()=>{
      const texto=ta.value.trim(), para=sel.value;
      if(!texto){ ta.focus(); return; } if(!para){ sel.focus(); return; }
      const upd={texto, paraId:para, paraNome:nomeDe(para), verIds:pegarVer().filter(i=>i!==para), editadoEm:Date.now()};
      Object.assign(t, upd); fecharModal(); setStatus('Tarefa salva ✓');
      salvarTarefa(Object.assign({},t), upd).catch(e=>setStatus('Não deu para salvar ('+((e&&e.code)||'erro')+')', true));
    };
    linha.append(c,ok); box.append(linha);
  });
}

$('btMenu').onclick=()=>abrirModal('menu', box=>{
  box.append(el('h3',null,'Opções'));
  box.append(el('label',null,'Seu nome'));
  const n=el('input'); n.maxLength=40; n.value=meuNome(); box.append(n);
  const salvar=el('button','btn','Salvar nome');
  salvar.onclick=async()=>{ const v=n.value.trim(); if(!v) return; salvar.disabled=true; try{ await db.doc('membros/'+me).set({nome:v},{merge:true}); lsSet('jbt_nome',v); fecharModal(); setStatus('Nome salvo ✓'); }catch(e){ salvar.disabled=false; setStatus('Não deu para salvar.', true); } };
  box.append(salvar);
  const pg=el('p','meta','Grupo: '+(grupo?grupo.nome:'')+' · '+membros.length+' pessoa(s) no app'); pg.style.marginTop='14px'; box.append(pg);
  const lista=el('p','meta',[...membros].map(m=>m.nome).sort((a,b)=>a.localeCompare(b,'pt-BR')).join(', ')); box.append(lista);
  const f=el('button','btn sec','Fechar'); f.style.marginTop='10px'; f.onclick=fecharModal; box.append(f);
});

// ---------- Lembrete de 24h ----------
function pendentesVelhas(){
  const agora=Date.now();
  return tarefas.filter(t=>t.status==='pendente' && (t.paraId===me || t.deId===me) && agora-t.criadoEm>=DIA);
}
function renderAlerta(){
  const box=$('alerta'); box.replaceChildren();
  const agora=Date.now();
  const lista=pendentesVelhas().filter(t=>{ const v=+(lsGet('jbt_aviso_'+t.id)||0); return agora-v>=DIA; });
  if(!lista.length){ box.classList.add('hidden'); return; }
  box.append(el('b',null, lista.length===1?'⚠ 1 tarefa pendente há mais de 24h':'⚠ '+lista.length+' tarefas pendentes há mais de 24h'));
  const ul=el('ul');
  lista.forEach(t=>{ const li=el('li'); li.append(el('b',null,t.texto.length>70?t.texto.slice(0,70)+'…':t.texto), document.createTextNode(' — para '+(t.paraId===me?'você':(nomeDe(t.paraId)||t.paraNome))+', pendente há '+tempo(agora-t.criadoEm))); ul.append(li); });
  const ok=el('button','btn sec peq','Ok, entendi');
  ok.onclick=()=>{ const n=Date.now(); lista.forEach(t=>lsSet('jbt_aviso_'+t.id,String(n))); renderAlerta(); };
  box.append(ul,ok); box.classList.remove('hidden');
}
function lembrete24h(){
  if(!podeAvisar()) return;
  const agora=Date.now(); const ult=+(lsGet('jbt_lemb')||0);
  if(agora-ult<DIA) return;
  const v=pendentesVelhas(); if(!v.length) return;
  lsSet('jbt_lemb',String(agora));
  const minhas=v.filter(t=>t.paraId===me).length;
  notificar('JB Tarefas: tarefas pendentes', minhas? 'Você tem '+minhas+' tarefa(s) pendente(s) há mais de 24h.' : v.length+' tarefa(s) que você pediu ainda estão pendentes.', 'lembrete');
}

// ---------- Lista ----------
function filtro(k){
  if(k==='paramim') return tarefas.filter(t=>t.status==='pendente' && t.paraId===me);
  if(k==='enviadas') return tarefas.filter(t=>t.status==='pendente' && t.deId===me && t.paraId!==me);
  if(k==='acomp') return tarefas.filter(t=>acompanho(t));
  if(k==='todas') return tarefas.filter(t=>t.status==='pendente');
  return tarefas.filter(t=>t.status==='feita').sort((a,b)=>(b.feitaEm||0)-(a.feitaEm||0));
}
const ABAS=[['paramim','Para mim'],['enviadas','Que eu pedi'],['acomp','Acompanho'],['todas','Todas pendentes'],['feitas','Resolvidas']];
function renderTabs(){
  const nav=$('tabs'); nav.replaceChildren();
  ABAS.forEach(([k,label])=>{
    const b=el('button','tab'+(aba===k?' on':''),label);
    if(k!=='feitas'){ const n=(k==='acomp'?filtro(k).filter(t=>t.status==='pendente'):filtro(k)).length; if(n) b.append(el('span','n',String(n))); }
    b.onclick=()=>{ aba=k; render(); window.scrollTo(0,0); };
    nav.append(b);
  });
  try{ const n=filtro('paramim').length; if(navigator.setAppBadge){ n?navigator.setAppBadge(n):navigator.clearAppBadge(); } }catch(e){}
}
function card(t){
  const feita=t.status==='feita'; const idade=Date.now()-t.criadoEm;
  const c=el('div','card'+(feita?' feita':'')+(!feita&&idade>=DIA?' atrasada':''));
  let chk;
  if(feita){ chk=el('button','check done','✓'); }
  else if(t.paraId===me){ chk=el('button','check','✓'); chk.setAttribute('aria-label','Marcar como resolvida'); chk.title='Marcar como resolvida'; chk.onclick=()=>modalResolver(t); }
  else { chk=el('button','check wait','⏳'); chk.title='Aguardando '+(nomeDe(t.paraId)||t.paraNome); }
  const b=el('div','corpo');
  b.append(el('div','txt',t.texto));
  const m=el('div','meta');
  const de=nomeDe(t.deId)||t.deNome||'—', para=nomeDe(t.paraId)||t.paraNome||'—';
  m.append(document.createTextNode('De '), el('b',null,t.deId===me?'você':de), document.createTextNode(' para '), el('b',null,t.paraId===me?'você':para));
  m.append(el('br'), document.createTextNode('Pedido em '+fmt(t.criadoEm)));
  if(ver(t).length){ m.append(el('br'), document.createTextNode('👁 Acompanha: '+nomesLista(ver(t)))); }
  b.append(m);
  if(feita){ b.append(el('span','tag ok','✓ Resolvida em '+fmt(t.feitaEm)+(t.feitaPorNome?' por '+t.feitaPorNome:''))); if(t.obs) b.append(el('div','obs','Obs.: '+t.obs)); }
  else {
    if(t.andamento){ const a=el('div','andam','📝 '+t.andamento); a.append(el('small',null,'Atualizado por '+(t.andamentoPor||'—')+' em '+fmt(t.andamentoEm))); b.append(a); }
    b.append(t.andamento ? el('span','tag and','Em andamento · aberta há '+tempo(idade)) : (idade>=DIA ? el('span','tag late','Pendente há '+tempo(idade)) : el('span','tag','Pendente há '+tempo(idade))));
  }
  if(!feita && (t.paraId===me || t.deId===me)){ const s=el('button','del','andamento'); s.onclick=()=>modalAndamento(t); b.append(s); }
  if(t.deId===me){
    if(!feita){ const e=el('button','del','editar'); e.onclick=()=>modalEditar(t); b.append(e); }
    const d=el('button','del','apagar'); d.onclick=()=>modalApagar(t); b.append(d);
  }
  c.append(chk,b); return c;
}
function renderLista(){
  const box=$('lista'); box.replaceChildren();
  const l=filtro(aba);
  if(!l.length){
    const msg={paramim:'Nenhuma tarefa pendente para você. 🎉',enviadas:'Nenhuma tarefa sua esperando outra pessoa.',acomp:'Nenhuma tarefa para você acompanhar.',todas:'Nenhuma tarefa pendente no grupo.',feitas:'Nenhuma tarefa resolvida ainda.'}[aba];
    box.append(el('div','vazio',msg)); return;
  }
  l.forEach(t=>box.append(card(t)));
}

function render(){
  if(!loadedG) return;
  if(!grupo){ mostrar('telaGrupo'); return; }
  document.title = grupo.nome+' · Tarefas';
  if(!loadedM) return;
  if(!membros.some(m=>m.id===me)){ $('nomeGrupoTela').textContent=grupo.nome; const g=lsGet('jbt_nome'); if(g && !$('inNome').value) $('inNome').value=g; mostrar('telaNome'); return; }
  mostrar('telaApp');
  $('hGrupo').textContent=grupo.nome; $('hMe').textContent='Olá, '+meuNome();
  if(modalKind) return;
  renderInstalar(); renderAtivarAvisos(); renderTabs(); renderAlerta(); renderLista();
}

// Avisa quando chega tarefa nova para mim ou quando resolvem uma que eu pedi
function checarNovidades(docs){
  docs.forEach(ch=>{
    const t=Object.assign({id:ch.doc.id}, ch.doc.data());
    const chave=t.id+':'+t.status+':'+t.paraId+':'+ver(t).join(',')+':'+(t.andamentoEm||0);
    if(vistos.has(chave)) return; vistos.add(chave);
    const papel=(t.paraId===me?'f':'')+(acompanho(t)?'v':''), antes=papeis[t.id]; papeis[t.id]=papel;
    const novoPapel = antes===undefined || antes!==papel;
    if(primeiraCarga) return;
    if(novoPapel && t.status==='pendente' && acompanho(t)) notificar('Para acompanhar: tarefa de '+(nomeDe(t.paraId)||t.paraNome||''), t.texto, 'v'+t.id);
    if(novoPapel && t.paraId===me && t.deId!==me && t.status==='pendente') notificar('Nova tarefa de '+(nomeDe(t.deId)||t.deNome||''), t.texto, 'n'+t.id);
    if(ch.type==='modified' && t.status==='pendente' && t.andamentoEm && t.andamentoPorId!==me && Date.now()-t.andamentoEm<120000 && (t.deId===me||t.paraId===me||acompanho(t))) notificar('Andamento: '+(t.texto.length>40?t.texto.slice(0,40)+'…':t.texto), t.andamento||'(sem texto)', 'a'+t.id);
    if(ch.type==='modified' && t.status==='feita' && t.feitaPorId!==me && (t.deId===me||acompanho(t)) && t.paraId!==me) notificar('Tarefa resolvida por '+(t.feitaPorNome||nomeDe(t.paraId)||''), t.texto, 'f'+t.id);
  });
}

function iniciar(){
  let timer=setTimeout(()=>setStatus('Os dados ainda não chegaram. Confira a internet.', true),12000);
  function pronto(){ if(loadedG && loadedM && loadedT){ clearTimeout(timer); setStatus(''); } }
  function falha(){ clearTimeout(timer); setStatus('Conexão perdida. Feche e abra o app de novo.', true); }
  db.doc('config/grupo').onSnapshot({includeMetadataChanges:true},s=>{ grupo=s.exists?s.data():null; if(!s.metadata.fromCache||grupo) loadedG=true; pronto(); render(); }, falha);
  db.collection('membros').onSnapshot({includeMetadataChanges:true},s=>{ membros=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(m=>typeof m.nome==='string'); if(!s.metadata.fromCache||membros.some(m=>m.id===me)) loadedM=true; pronto(); render(); }, falha);
  db.collection('tarefas').orderBy('criadoEm','desc').onSnapshot({includeMetadataChanges:true},s=>{
    tarefas=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(t=>typeof t.texto==='string');
    checarNovidades(s.docChanges());
    if(!s.metadata.fromCache){ loadedT=true; if(primeiraCarga){ primeiraCarga=false; } }
    pronto(); render(); lembrete24h();
  }, falha);
  setInterval(()=>{ if(!modalKind) render(); lembrete24h(); }, 5*60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(!modalKind) render(); lembrete24h(); } });
}

auth.onAuthStateChanged(u=>{
  if(u){ if(!me){ me=u.uid; iniciar(); } return; }
  auth.signInAnonymously().catch(()=>setStatus('Sem conexão. Confira a internet e abra de novo.', true));
});
})();
</script>
<script>
(function(){
  var URL_APP="https://marciospeedcam.github.io/jb-tarefas/";
  function aviso(m){ try{ var s=document.getElementById('status'); s.textContent=m; s.classList.remove('hidden'); setTimeout(function(){s.classList.add('hidden')},2500); }catch(e){} }
  function copiar(t){
    if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function(){return true},function(){return fallback(t)});
    return Promise.resolve(fallback(t));
  }
  function fallback(t){ try{ var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,999); var ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; } }
  var b=document.getElementById("btShareApp"); if(!b) return;
  b.addEventListener("click",function(){
    var data={title:"JB Tarefas",text:"App de tarefas da JB. Abra no Safari e toque em Compartilhar > Adicionar à Tela de Início:",url:URL_APP};
    if(navigator.share){ navigator.share(data).catch(function(e){ if(!e||e.name!=="AbortError") copiar(URL_APP).then(function(ok){aviso(ok?"Link copiado: cole no WhatsApp":URL_APP)}); }); return; }
    copiar(URL_APP).then(function(ok){aviso(ok?"Link copiado: cole no WhatsApp":URL_APP)});
  });
})();
</script>
